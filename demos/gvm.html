<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Violation Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<script>
var view=D.view,role=D.role,add=D.add,rem=D.rem,move=D.move,click=D.click,type=D.type,count=D.count,html=D.html,style=D.style,step=D.step,chip=D.chip,aed=D.aed,num=D.num,stage={querySelectorAll:function(s){return document.getElementById('stage').querySelectorAll(s)}};

D.scene('A violation appears on the government portal','The clock starts now: 10 days to respond, 45 to settle.',6,[
 [0,0,view('vPortal')],[0,0,add('#who')],[0,0,step(1)],
 [.8,0,add('#pNew')],[1.6,.9,move('#pNew td:nth-child(3)')],[2.7,0,click()],[2.7,0,add('#pNew','sel')]]);
D.scene('Logged once, owned by one team','Facility opens the case in seconds, and the deadline starts counting itself.',9,[
 [0,0,view('vList')],[0,0,role('Facility')],[0,0,step(2)],
 [.6,.8,move('#btnLog')],[1.5,0,click('#btnLog')],[1.6,0,add('#modal','on')],
 [2.1,.8,type('#fRef','V-2291')],[3,.9,type('#fProj','Tower B')],[4,1.2,type('#fType','Scaffold without guardrail')],[5.3,.7,type('#fAmt','AED 5,000')],
 [6.1,.7,move('#btnSave')],[6.9,0,click('#btnSave')],[7.1,0,rem('#modal','on')],[7.4,0,add('#lNew')],[7.4,0,html('#kOpen','12')]]);
D.scene('The right team knows in seconds','No forwarding, no guessing which project it belongs to.',6,[
 [0,0,step(3)],[0,0,rem('#who')],[.2,0,add('#phone')],[1.2,0,add('#notif')],[2.6,0,role('Projects')],[4.8,0,rem('#notif')],[5.1,0,rem('#phone')],[5.6,0,add('#who')]]);
D.scene('Evidence goes straight onto the case','The project team replies with photos inside the window, in the same place.',9,[
 [0,0,view('vCase')],[0,0,step(4)],[0,1.2,style('#ringC','strokeDashoffset',function(e){return 207*.3*e})],
 [.8,.8,move('#btnAtt')],[1.7,0,click('#btnAtt')],[1.8,0,add('#file')],[1.9,1.3,style('#fileP','width',function(e){return e*100+'%'})],
 [3.2,0,html('#fileOk','<span style="color:#34D399">uploaded</span>')],
 [3.4,2.4,type('#fResp','Guardrail installed the same day. Photo attached with date and location. Requesting the fine be withdrawn.')],
 [6,.7,move('#btnSub')],[6.8,0,click('#btnSub')],[7,0,function(){var c=D.$('#cStat');c.className='chip amber';c.textContent='Objection filed'}],[7.1,0,add('#au3')]]);
D.scene('Nothing drifts past a deadline','If the objection is rejected, the case escalates itself and the settlement clock takes over.',7,[
 [0,0,step(5)],[.8,0,add('#au4')],[.8,0,function(){var c=D.$('#cStat');c.className='chip bad';c.textContent='Rejected'}],
 [2,0,function(){D.$('#ringL').innerHTML='DAYS TO<br>SETTLE';D.$('#ringC').style.stroke='#4C7DFF'}],[2,1,count('#ringN',45,function(v){return v})],
 [2,1,style('#ringC','strokeDashoffset',function(e){return 207*.3*(1-e)})],[3.3,0,add('#esc')],[3.5,0,add('#au5')]]);
D.scene('Every fine is charged back','Finance pays on time and recovers the cost from the subcontractor who caused it.',9,[
 [0,0,view('vFin')],[0,0,role('Finance')],[0,0,step(6)],
 [.8,.8,move('#btnPay')],[1.7,0,click('#btnPay')],[1.9,0,function(){D.$('#btnPay').outerHTML='<span class="chip good" id="btnPay">Paid · day 21</span>';D.$('#rcpt').className='chip good';D.$('#rcpt').textContent='saved to case';D.$('#finClock').className='chip good';D.$('#finClock').textContent='Settled with 24 days to spare'}],
 [2.6,1.4,type('#fSub','Scaffolding subcontractor (sample)')],[4.2,.7,move('#btnRec')],[5,0,click('#btnRec')],
 [5.2,1.6,count('#recv',5000,aed)],[5.2,1.6,style('#meter','width',function(e){return e*100+'%'})]]);
D.scene('Management sees the whole picture','Every case, every dirham and every step, ready for any audit.',8,[
 [0,0,view('vDash')],[0,0,role('Management')],[0,0,step(7)],[0,.6,move('.dk')],
 [.4,1.6,count('#d1',64,function(v){return v})],[.4,1.6,count('#d2',100,function(v){return v+'%'})],[.4,1.6,count('#d3',53200,aed)],[.4,1.6,count('#d4',32,function(v){return (v/10).toFixed(1)+' days'})],
 [.8,1.6,function(p){stage.querySelectorAll('.bars i').forEach(function(b){b.style.height=(b.dataset.h*ease(p))+'%'})}]]);


D.init({"id": "gvm", "name": "Government Violation Management", "app": "Violations", "url": "violations.yourcompany.app", "roles": [["FA", "Facility"], ["PR", "Projects"], ["FI", "Finance"], ["MG", "Management"]], "labels": [["Portal", "Portal notice"], ["Log", "Facility logs it"], ["Alert", "Project team alerted"], ["Evidence", "Evidence filed"], ["Escalate", "Decision and escalation"], ["Recover", "Finance pays and recovers"], ["Overview", "Management sees it all"]], "views": "\n        <!-- portal -->\n        <div class=\"view\" id=\"vPortal\">\n          <div class=\"ph\">Municipal Inspections Portal <span>External \u00b7 sample</span></div>\n          <table><thead><tr><th>Ref</th><th>Site</th><th>Violation</th><th>Fine</th><th>Issued</th></tr></thead><tbody>\n            <tr class=\"new\" id=\"pNew\"><td>V-2291</td><td>Tower B, Plot 14</td><td>Scaffold without guardrail</td><td>AED 5,000</td><td>Today</td></tr>\n            <tr><td>V-2270</td><td>Warehouse 3</td><td>Blocked fire exit</td><td>AED 10,000</td><td>12 Sep</td></tr>\n            <tr><td>V-2248</td><td>Camp North</td><td>Waste disposal</td><td>AED 2,000</td><td>04 Sep</td></tr>\n            <tr><td>V-2231</td><td>Tower A</td><td>Noise after hours</td><td>AED 3,000</td><td>28 Aug</td></tr>\n          </tbody></table>\n        </div>\n        <!-- list -->\n        <div class=\"view\" id=\"vList\">\n          <div class=\"vh\"><h3>Violations</h3><span class=\"btn\" id=\"btnLog\">+ Log violation</span></div>\n          <div class=\"kpis\">\n            <div class=\"kpi\"><small>Open cases</small><div id=\"kOpen\">11</div></div>\n            <div class=\"kpi\"><small>Due this week</small><div>3</div></div>\n            <div class=\"kpi\"><small>Recovered this year</small><div>AED 48,200</div></div>\n          </div>\n          <table><thead><tr><th>Case</th><th>Project</th><th>Fine</th><th>Status</th><th>Clock</th></tr></thead><tbody>\n            <tr class=\"new\" id=\"lNew\"><td>V-2291</td><td>Tower B</td><td>AED 5,000</td><td><span class=\"chip sig\">Assigned</span></td><td><span class=\"chip amber\">10 days left</span></td></tr>\n            <tr><td>V-2270</td><td>Warehouse 3</td><td>AED 10,000</td><td><span class=\"chip\">Under objection</span></td><td><span class=\"chip amber\">4 days left</span></td></tr>\n            <tr><td>V-2248</td><td>Camp North</td><td>AED 2,000</td><td><span class=\"chip good\">Recovered</span></td><td><span class=\"chip\">Closed</span></td></tr>\n            <tr><td>V-2231</td><td>Tower A</td><td>AED 3,000</td><td><span class=\"chip good\">Paid</span></td><td><span class=\"chip\">Closed</span></td></tr>\n          </tbody></table>\n          <div class=\"scrim\" id=\"modal\"><div class=\"modal\">\n            <h4>Log a violation</h4>\n            <div class=\"fld\"><label>Portal reference</label><div id=\"fRef\"></div></div>\n            <div class=\"fld\"><label>Project</label><div id=\"fProj\"></div></div>\n            <div class=\"fld\"><label>Violation</label><div id=\"fType\"></div></div>\n            <div class=\"fld\"><label>Fine</label><div id=\"fAmt\"></div></div>\n            <div style=\"display:flex;justify-content:flex-end;margin-top:14px\"><span class=\"btn\" id=\"btnSave\">Open case</span></div>\n          </div></div>\n        </div>\n        <!-- case -->\n        <div class=\"view\" id=\"vCase\">\n          <div class=\"cgrid\">\n            <div>\n              <div class=\"chead\">\n                <div class=\"ring\"><svg width=\"78\" height=\"78\"><circle cx=\"39\" cy=\"39\" r=\"33\" stroke=\"#1E2636\" stroke-width=\"6\" fill=\"none\"/><circle id=\"ringC\" cx=\"39\" cy=\"39\" r=\"33\" stroke=\"#E8890C\" stroke-width=\"6\" fill=\"none\" stroke-linecap=\"round\" stroke-dasharray=\"207\" stroke-dashoffset=\"0\"/></svg>\n                  <div class=\"rt\"><div><b id=\"ringN\">7</b><small id=\"ringL\">DAYS TO<br>RESPOND</small></div></div></div>\n                <div><h5>V-2291 \u00b7 Scaffold without guardrail</h5><p>Tower B, Plot 14 \u00b7 AED 5,000 \u00b7 Owner: Tower B project team</p><span class=\"chip sig\" id=\"cStat\">Awaiting response</span></div>\n              </div>\n              <div class=\"resp\">\n                <h6>PROJECT RESPONSE</h6>\n                <span class=\"btn ghost\" id=\"btnAtt\">Attach evidence</span>\n                <div class=\"file\" id=\"file\"><span class=\"th\"></span><div class=\"nm\">guardrail-installed.jpg<div class=\"pb\"><i id=\"fileP\"></i></div></div><span class=\"chip\" id=\"fileOk\">uploading</span></div>\n                <div class=\"txt\" id=\"fResp\"></div>\n                <div style=\"display:flex;justify-content:flex-end\"><span class=\"btn\" id=\"btnSub\">Submit objection</span></div>\n              </div>\n              <div class=\"esc\" id=\"esc\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\"><path d=\"M12 3l10 18H2z\"/><path d=\"M12 10v5M12 18v.5\"/></svg>Objection rejected. Escalated to the project manager and Finance automatically.</div>\n            </div>\n            <div class=\"audit\"><h6>AUDIT TRAIL</h6><ul>\n              <li class=\"in a\">Found on portal<small>Facility \u00b7 day 0</small></li>\n              <li class=\"in s\">Assigned to Tower B<small>System \u00b7 day 0</small></li>\n              <li id=\"au3\" class=\"s\">Evidence and objection filed<small>Projects \u00b7 day 3</small></li>\n              <li id=\"au4\" class=\"b\">Authority rejected objection<small>Authority \u00b7 day 9</small></li>\n              <li id=\"au5\" class=\"a\">Escalated, settlement clock started<small>System \u00b7 day 9</small></li>\n              <li id=\"au6\" class=\"g\">Paid and charged back<small>Finance \u00b7 day 21</small></li>\n            </ul></div>\n          </div>\n        </div>\n        <!-- finance -->\n        <div class=\"view\" id=\"vFin\">\n          <div class=\"vh\"><h3>Penalty recovery</h3><span class=\"chip amber\" id=\"finClock\">24 days left to settle</span></div>\n          <div class=\"fin\">\n            <div class=\"card\"><h6>V-2291 PENALTY</h6><div class=\"big\">AED 5,000</div>\n              <div class=\"rowx\">Paid to authority <span class=\"btn\" id=\"btnPay\">Pay now</span></div>\n              <div class=\"rowx\">Receipt <span class=\"chip\" id=\"rcpt\">pending</span></div>\n            </div>\n            <div class=\"card\"><h6>CHARGE BACK</h6>\n              <div class=\"fld\"><label>Responsible subcontractor</label><div id=\"fSub\"></div></div>\n              <div class=\"meter\"><i id=\"meter\"></i></div>\n              <div class=\"rowx\" style=\"border:0;padding-top:4px\">Recovered <b id=\"recv\" style=\"font-family:var(--fd);color:var(--t1);font-size:18px\">AED 0</b></div>\n              <div style=\"display:flex;justify-content:flex-end;margin-top:6px\"><span class=\"btn\" id=\"btnRec\">Charge back</span></div>\n            </div>\n          </div>\n        </div>\n        <!-- dashboard -->\n        <div class=\"view\" id=\"vDash\">\n          <div class=\"vh\"><h3>This year at a glance</h3><span class=\"chip good\">Audit ready</span></div>\n          <div class=\"dk\">\n            <div class=\"kpi\"><small>Cases handled</small><div id=\"d1\">0</div></div>\n            <div class=\"kpi\"><small>Answered on time</small><div id=\"d2\">0%</div></div>\n            <div class=\"kpi\"><small>Fines recovered</small><div id=\"d3\">AED 0</div></div>\n            <div class=\"kpi\"><small>Avg response</small><div id=\"d4\">0 days</div></div>\n          </div>\n          <div class=\"chart\"><h6 style=\"font-family:var(--fm);font-size:9.5px;color:var(--t3);letter-spacing:.1em;font-weight:400\">CASES BY PROJECT \u00b7 AMBER = STILL OPEN</h6>\n            <div class=\"bars\"><div><i data-h=\"72\"></i></div><div><i data-h=\"54\"></i></div><div><i class=\"r\" data-h=\"38\"></i></div><div><i data-h=\"88\"></i></div><div><i data-h=\"30\"></i></div><div><i class=\"r\" data-h=\"46\"></i></div></div>\n            <div class=\"bl\"><span>Tower A</span><span>Tower B</span><span>Warehouse 3</span><span>Camp North</span><span>Depot</span><span>Marina</span></div>\n          </div>\n        </div>\n      ", "extra": "<div class=\"phone\" id=\"phone\"><div class=\"scr\"><div class=\"tm\">9:41</div><div class=\"dt\">Thursday 18 September</div>\n    <div class=\"notif\" id=\"notif\"><div class=\"nh\"><i></i>VIOLATIONS \u00b7 now</div><b>New violation for Tower B</b><p>V-2291, scaffold without guardrail. You have 10 days to respond. Tap to open.</p></div></div></div>"});
</script></body></html>
