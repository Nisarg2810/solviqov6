<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maintenance Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo.css?v=3"></head><body>

<script>
var view=D.view,role=D.role,add=D.add,rem=D.rem,move=D.move,click=D.click,type=D.type,count=D.count,html=D.html,style=D.style,step=D.step,chip=D.chip,aed=D.aed,num=D.num,stage={querySelectorAll:function(s){return document.getElementById('stage').querySelectorAll(s)}};

D.scene('Raised from a phone in under a minute','Name and project fill themselves in. Snap a photo and send.',8,[
 [0,0,view('vList')],[0,0,step(1)],[0,0,role('Raiser')],[.2,0,add('#phone')],
 [1,.8,type('#qA','Pump house 3')],[2,1.6,type('#qT','Valve leaking under pump 3, puddle forming')],
 [3.9,.7,move('#qP')],[4.7,0,click('#qP')],[4.8,0,html('#qP','<span style="color:var(--good)">valve.jpg attached</span>')],
 [5.4,.7,move('#qGo')],[6.2,0,click('#qGo')],[6.3,0,html('#qGo','Sent')],[6.8,0,rem('#phone')],[7,0,add('#oNew')],[7,0,html('#kOpen','23')],[7.4,0,add('#who')]]);
D.scene('It lands with the right reviewer','No inbox to watch. The reviewer sees it and passes it on in one click.',6,[
 [0,0,role('Reviewer')],[0,0,step(2)],[.6,.8,move('#btnAcc')],[1.6,0,click('#btnAcc')],[1.8,0,chip('#oSt','amber','With maintenance')]]);
D.scene('Inspected and priced on the spot','Maintenance checks the issue and puts a price on the fix.',8,[
 [0,0,view('vInsp')],[0,0,role('Maintenance')],[0,0,step(3)],[.6,0,add('#c1','ok')],[1.1,0,add('#c2','ok')],[1.6,0,add('#c3','ok')],
 [2.2,1.2,type('#eFix','Replace valve gasket')],[3.6,.8,type('#eCost','AED 1,800')],[4.8,.7,move('#btnEst')],[5.6,0,click('#btnEst')]]);
D.scene('Spend approved at the right level','Small fixes go straight through. Big ones go to budget. Nobody has to decide which.',8,[
 [0,0,view('vSpend')],[0,0,role('Cost Control')],[0,0,step(4)],[.4,0,add('#p1')],[.5,1.4,style('#p1','left',function(e){return 14.4*e+'%'})],
 [2,0,add('#s1')],[2.1,0,add('#s1','ok')],[3.4,0,add('#p2')],[4.2,0,add('#s2')],[4.3,0,add('#s2','no')]]);
D.scene('Fixed, then checked','The project manager accepts the work or sends it back. Nothing is closed half done.',7,[
 [0,0,view('vRev')],[0,0,role('Project Manager')],[0,0,step(5)],[1.8,.8,move('#btnOk')],[2.8,0,click('#btnOk')],[3,0,chip('#rvSt','good','Accepted')]]);
D.scene('Closed only when the raiser is satisfied','The person who spotted it has the final say.',6,[
 [0,0,role('Raiser')],[0,0,step(6)],[0,0,rem('#who')],[.2,0,add('#phone2')],[1,0,add('#notif')],[1.8,.9,move('#nOk')],[2.9,0,click('#nOk')],
 [3,0,html('#nOk','Closed')],[4.6,0,rem('#notif')],[4.9,0,rem('#phone2')],[5.4,0,add('#who')]]);
D.scene('Overdue work and repeat faults, visible live','Managers see what is stuck and where the same problem keeps coming back.',8,[
 [0,0,view('vDash')],[0,0,role('Project Manager')],[0,0,step(7)],
 [.4,1.6,count('#d1',22,num)],[.4,1.6,count('#d2',4,num)],[.4,1.6,count('#d3',12300,aed)],[.4,1.6,count('#d4',62,num)],
 [.8,1.6,style('.hb i','width',function(e,el){return el.dataset.w*e+'%'})],[3,.8,move('.hb div')]]);
D.init({"id": "moms", "name": "Maintenance Observation Management", "app": "Observations", "url": "maintenance.yourcompany.app", "roles": [["RS", "Raiser"], ["RV", "Reviewer"], ["MT", "Maintenance"], ["CC", "Cost Control"], ["PM", "Project Manager"]], "labels": [["Raise", "Raised from a phone"], ["Route", "Routed to reviewer"], ["Inspect", "Inspected and priced"], ["Spend", "Spend approved"], ["Review", "Fix reviewed"], ["Close", "Raiser confirms"], ["Overview", "Visible live"]], "views": "<style>\n.thr{position:relative;height:74px;margin:22px 6px 10px}\n.thr .ln{position:absolute;left:0;right:0;top:30px;height:10px;border-radius:6px;background:linear-gradient(90deg,rgba(52,211,153,.35) 0 40%,rgba(232,137,12,.35) 40% 100%)}\n.thr .mk{position:absolute;left:40%;top:14px;width:2px;height:42px;background:var(--t1)}\n.thr .mk span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--fm);font-size:10px;color:var(--t2)}\n.thr .pin{position:absolute;top:22px;width:26px;height:26px;border-radius:50%;margin-left:-13px;border:3px solid var(--p1);opacity:0;transition:opacity .3s}\n.thr .pin.in{opacity:1}\n.thr .pin em{position:absolute;top:30px;left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-family:var(--fm);font-size:10px;color:var(--t1)}\n.ph2{display:flex;gap:12px;margin-bottom:12px}.ph2 div{flex:1;height:120px;border-radius:10px;border:1px solid var(--line2);position:relative;overflow:hidden;background:linear-gradient(135deg,#3a4458,#1a2130)}\n.ph2 div::before{content:\"\";position:absolute;left:30%;top:28%;width:40%;height:44%;border-radius:50%;background:radial-gradient(circle,#5c6b85 0 30%,#2a3346 32% 60%,transparent 62%)}\n.ph2 div.bad::after{content:\"\";position:absolute;left:48%;top:60%;width:10px;height:26px;border-radius:0 0 6px 6px;background:linear-gradient(#4c7dff,transparent)}\n.ph2 small{position:absolute;left:8px;bottom:6px;font-family:var(--fm);font-size:9px;color:var(--t1);background:rgba(0,0,0,.5);padding:2px 6px;border-radius:4px}\n</style>\n<div class=\"view\" id=\"vList\">\n <div class=\"vh\"><h3>Observations</h3><span class=\"chip sig\">Routed automatically</span></div>\n <div class=\"kpis\"><div class=\"kpi\"><small>Open</small><div id=\"kOpen\">22</div></div><div class=\"kpi\"><small>Overdue</small><div>4</div></div><div class=\"kpi\"><small>Closed this month</small><div>61</div></div></div>\n <table><thead><tr><th>Ref</th><th>Area</th><th>Issue</th><th>Owner</th><th>Status</th></tr></thead><tbody>\n <tr class=\"new\" id=\"oNew\"><td>OBS-0418</td><td>Pump house 3</td><td>Leaking valve</td><td>Reviewer</td><td><span class=\"chip sig\" id=\"oSt\">New</span></td></tr>\n <tr><td>OBS-0417</td><td>Workshop</td><td>Cracked floor slab</td><td>Maintenance</td><td><span class=\"chip amber\">Being fixed</span></td></tr>\n <tr><td>OBS-0412</td><td>Tank farm</td><td>Corroded ladder</td><td>Cost Control</td><td><span class=\"chip\">Awaiting spend</span></td></tr>\n <tr><td>OBS-0409</td><td>Control room</td><td>Faulty AC unit</td><td>Raiser</td><td><span class=\"chip good\">Closed</span></td></tr>\n </tbody></table>\n <div style=\"display:flex;justify-content:flex-end;margin-top:14px\"><span class=\"btn\" id=\"btnAcc\">Send to maintenance</span></div></div>\n<div class=\"view\" id=\"vInsp\">\n <div class=\"vh\"><h3>OBS-0418 \u00b7 Inspection</h3><span class=\"chip amber\">Maintenance</span></div>\n <div class=\"fin\"><div class=\"card\"><h6>ON SITE CHECKS</h6><ul class=\"ck\">\n  <li id=\"c1\"><i></i>Leak source confirmed</li><li id=\"c2\"><i></i>Area made safe</li><li id=\"c3\"><i></i>Parts available in store</li></ul></div>\n <div class=\"card\"><h6>ESTIMATE</h6><div class=\"fld\"><label>Fix</label><div id=\"eFix\"></div></div><div class=\"fld\"><label>Cost</label><div id=\"eCost\"></div></div>\n  <div style=\"display:flex;justify-content:flex-end;margin-top:10px\"><span class=\"btn\" id=\"btnEst\">Submit estimate</span></div></div></div></div>\n<div class=\"view\" id=\"vSpend\">\n <div class=\"vh\"><h3>Spend approval</h3><span class=\"chip\">Threshold AED 5,000</span></div>\n <div class=\"card\"><h6>WHERE EACH FIX GOES</h6>\n  <div class=\"thr\"><div class=\"ln\"></div><div class=\"mk\"><span>AED 5,000 threshold</span></div>\n   <div class=\"pin\" id=\"p1\" style=\"left:0;background:var(--good)\"><em>OBS-0418 \u00b7 AED 1,800</em></div>\n   <div class=\"pin\" id=\"p2\" style=\"left:88%;background:var(--amber)\"><em>OBS-0402 \u00b7 AED 14,500</em></div></div>\n  <ul class=\"ck\" style=\"margin-top:26px\"><li class=\"hide\" id=\"s1\"><i></i>OBS-0418 under threshold, approved automatically<span class=\"chip good\">approved</span></li>\n  <li class=\"hide\" id=\"s2\"><i></i>OBS-0402 over threshold, routed to the budget team<span class=\"chip amber\">with budget</span></li></ul></div></div>\n<div class=\"view\" id=\"vRev\">\n <div class=\"vh\"><h3>OBS-0418 \u00b7 Review the fix</h3><span class=\"chip\" id=\"rvSt\">Submitted by maintenance</span></div>\n <div class=\"ph2\"><div class=\"bad\"><small>BEFORE</small></div><div><small>AFTER</small></div></div>\n <div class=\"txt\">Valve gasket replaced and pressure tested. No leak after 30 minutes.</div>\n <div style=\"display:flex;gap:10px;justify-content:flex-end\"><span class=\"btn ghost\">Send back for rework</span><span class=\"btn\" id=\"btnOk\">Accept</span></div></div>\n<div class=\"view\" id=\"vDash\">\n <div class=\"vh\"><h3>Maintenance, live</h3><span class=\"chip good\">Every step on record</span></div>\n <div class=\"dk\"><div class=\"kpi\"><small>Open</small><div id=\"d1\">0</div></div><div class=\"kpi\"><small>Overdue</small><div id=\"d2\" style=\"color:var(--amber2)\">0</div></div><div class=\"kpi\"><small>Awaiting spend</small><div id=\"d3\">AED 0</div></div><div class=\"kpi\"><small>Closed this month</small><div id=\"d4\">0</div></div></div>\n <div class=\"chart\" style=\"height:auto\"><h6 style=\"font-family:var(--fm);font-size:9.5px;color:var(--t3);letter-spacing:.1em;font-weight:400\">REPEAT FAULTS BY AREA \u00b7 AMBER = PATTERN TO FIX</h6>\n <div class=\"hb\"><div>Pump houses<span class=\"t\"><i class=\"r\" data-w=\"88\"></i></span><b>14</b></div><div>Workshop<span class=\"t\"><i data-w=\"44\"></i></span><b>7</b></div>\n <div>Tank farm<span class=\"t\"><i data-w=\"38\"></i></span><b>6</b></div><div>Control room<span class=\"t\"><i data-w=\"25\"></i></span><b>4</b></div><div>Camp<span class=\"t\"><i data-w=\"19\"></i></span><b>3</b></div></div></div></div>\n", "extra": "<div class=\"phone\" id=\"phone\"><div class=\"pscr\"><div class=\"ptop\"><span style=\"width:14px;height:14px;border-radius:4px;background:var(--amber)\"></span>New observation</div>\n<div class=\"pf\"><label>Raised by</label><div>R. Menon <span class=\"auto\">AUTO</span></div></div>\n<div class=\"pf\"><label>Project</label><div>North Field Ops <span class=\"auto\">AUTO</span></div></div>\n<div class=\"pf\"><label>Area</label><div id=\"qA\"></div></div>\n<div class=\"pf\"><label>What did you see</label><div id=\"qT\" style=\"min-height:44px;align-items:flex-start\"></div></div>\n<div class=\"pf\"><label>Photo</label><div id=\"qP\" style=\"color:var(--t3)\">Tap to add</div></div>\n<div class=\"pbtn\" id=\"qGo\">Raise observation</div></div></div>\n<div class=\"phone\" id=\"phone2\"><div class=\"scr\"><div class=\"tm\">16:20</div><div class=\"dt\">Tuesday 23 September</div>\n<div class=\"notif\" id=\"notif\"><div class=\"nh\"><i></i>MAINTENANCE \u00b7 now</div><b>Your observation is fixed</b><p>OBS-0418, leaking valve at pump house 3. Happy to close it?</p><span class=\"nbtn\" id=\"nOk\">Confirm closed</span></div></div></div>"});
</script></body></html>
