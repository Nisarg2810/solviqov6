<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fleet Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="demo.css?v=3"></head><body>
<script src="demo.js?v=3"></script>
<script>
var view=D.view,role=D.role,add=D.add,rem=D.rem,move=D.move,click=D.click,type=D.type,count=D.count,html=D.html,style=D.style,step=D.step,chip=D.chip,aed=D.aed,num=D.num,stage={querySelectorAll:function(s){return document.getElementById('stage').querySelectorAll(s)}};

D.scene('The project asks for a machine','One short request replaces a chain of calls.',9,[
 [0,0,view('vReq')],[0,0,add('#who')],[0,0,role('Project')],[0,0,step(1)],[.5,.8,move('#btnNew')],[1.4,0,click('#btnNew')],[1.5,0,add('#modal','on')],
 [2,1.1,type('#fEq','50 ton mobile crane')],[3.2,.6,type('#fSite','Tower B')],[3.9,.7,type('#fFrom','1 October')],[4.7,.6,type('#fDur','3 months')],
 [5.6,.7,move('#btnSend')],[6.4,0,click('#btnSend')],[6.6,0,rem('#modal','on')],[6.9,0,add('#rNew')]]);
D.scene('The supplier uploads everything in one place','Papers and photos land on the machine record, not in someone\'s inbox.',7,[
 [0,0,view('vDocs')],[0,0,role('Supplier')],[0,0,step(2)],
 [.4,0,add('#u1')],[.5,1,style('#u1 .pb i','width',function(e){return e*100+'%'})],[1,0,add('#u2')],[1.1,1,style('#u2 .pb i','width',function(e){return e*100+'%'})],
 [1.6,0,add('#u3')],[1.7,1,style('#u3 .pb i','width',function(e){return e*100+'%'})],[2.2,0,add('#u4')],[2.3,1.4,style('#u4 .pb i','width',function(e){return e*100+'%'})],
 [4,0,chip('#dSt','good','All documents in')]]);
D.scene('Inspected against a checklist','Anything that fails goes straight back to the supplier to fix.',9,[
 [0,0,view('vInsp')],[0,0,role('Fleet')],[0,0,step(3)],[.6,0,add('#k1','ok')],[1.1,0,add('#k2','ok')],[1.8,0,add('#k3','no')],[1.9,0,add('#k3c')],[1.9,0,chip('#k3c','bad','expired, returned to supplier')],
 [2,0,chip('#iSt','bad','Returned to supplier')],[4,0,add('#re','in')],[4.8,0,rem('#k3','no')],[4.8,0,add('#k3','ok')],[4.8,0,chip('#k3c','good','renewed')],
 [5.4,0,add('#k4','ok')],[6,0,chip('#iSt','good','Passed')]]);
D.scene('Three sign offs, in the right order','Fleet, project and procurement approve in sequence, then it flows into purchasing.',7,[
 [0,0,view('vAppr')],[0,0,role('Procurement')],[0,0,step(4)],[.6,0,add('#a1','ok')],[.8,.8,style('#l1','width',function(e){return e*100+'%'})],
 [1.7,0,add('#a2','ok')],[1.9,.8,style('#l2','width',function(e){return e*100+'%'})],[2.8,0,add('#a3','ok')],[3.4,0,add('#po')],[3.4,0,chip('#aSt','good','Approved')]]);
D.scene('Delivered and confirmed on site','The site team confirms receipt from a phone. The record updates for everyone.',6,[
 [0,0,role('Project')],[0,0,step(5)],[0,0,rem('#who')],[.2,0,add('#phone')],[1,0,add('#notif')],[1.8,.9,move('#nOk')],[2.9,0,click('#nOk')],
 [3,0,html('#nOk','Received')],[3.1,0,chip('#rSt','good','Mobilized')],[4.6,0,rem('#notif')],[4.9,0,rem('#phone')],[5.4,0,add('#who')]]);
D.scene('Every machine, live on one board','Working, down or demobilized, on every site, without a single phone call.',6,[
 [0,0,view('vBoard')],[0,0,step(6)],[.6,0,add('#cr')],[.6,0,add('#cr','newa')],[1,0,html('#nW','Working 42')]]);
D.scene('One report, three teams told','A breakdown reaches the supplier, fleet and procurement at the same moment.',8,[
 [0,0,step(7)],[.4,.8,move('#btnBk')],[1.4,0,click('#btnBk')],[1.5,0,add('#cr','down')],[1.5,0,chip('#crS','bad','Down')],[1.6,0,html('#nW','Working 41')],[1.6,0,html('#nD','Down 3')],
 [1.8,0,rem('#who')],[2.2,0,add('#t1')],[2.7,0,add('#t2')],[3.2,0,add('#t3')]]);
D.init({"id": "fleet", "name": "Fleet Pre-Inspection and Visibility", "app": "Fleet", "url": "fleet.yourcompany.app", "roles": [["PJ", "Project"], ["SP", "Supplier"], ["FL", "Fleet"], ["PC", "Procurement"]], "labels": [["Request", "Machine requested"], ["Documents", "Supplier uploads"], ["Inspect", "Inspected"], ["Approve", "Three sign offs"], ["Deliver", "Receipt confirmed"], ["Live", "Live fleet board"], ["Breakdown", "Breakdown alert"]], "views": "<style>\n.docs{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.docs .file{margin:0}\n.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}\n.ast{background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:12px;transition:.4s}\n.ast h5{font-size:12.5px;font-weight:600;margin-bottom:3px}.ast p{font-size:11px;color:var(--t3);margin-bottom:9px}\n.ast .chip::before{content:\"\";width:7px;height:7px;border-radius:50%;background:currentColor}\n.ast.down{border-color:rgba(248,113,113,.55);box-shadow:0 0 0 1px rgba(248,113,113,.4),0 0 24px -6px rgba(248,113,113,.5)}\n.ast.newa{border-color:var(--amber)}\n.toast.r{border-left-color:var(--bad)}\n</style>\n<div class=\"view\" id=\"vReq\">\n <div class=\"vh\"><h3>Equipment requests</h3><span class=\"btn\" id=\"btnNew\">+ Request equipment</span></div>\n <table><thead><tr><th>Request</th><th>Equipment</th><th>Site</th><th>Supplier</th><th>Status</th></tr></thead><tbody>\n <tr class=\"new\" id=\"rNew\"><td>EQ-0871</td><td>50 ton mobile crane</td><td>Tower B</td><td>Supplier A</td><td><span class=\"chip amber\" id=\"rSt\">Awaiting supplier</span></td></tr>\n <tr><td>EQ-0869</td><td>Excavator 20t</td><td>Marina</td><td>Supplier C</td><td><span class=\"chip good\">Mobilized</span></td></tr>\n <tr><td>EQ-0866</td><td>Boom lift</td><td>Tower A</td><td>Supplier B</td><td><span class=\"chip sig\">In approval</span></td></tr>\n <tr><td>EQ-0860</td><td>Water tanker</td><td>Camp North</td><td>Supplier A</td><td><span class=\"chip\">Demobilized</span></td></tr>\n </tbody></table>\n <div class=\"scrim\" id=\"modal\"><div class=\"modal\"><h4>Request equipment</h4>\n  <div class=\"fld\"><label>Equipment</label><div id=\"fEq\"></div></div><div class=\"fld\"><label>Site</label><div id=\"fSite\"></div></div>\n  <div class=\"fld\"><label>Needed from</label><div id=\"fFrom\"></div></div><div class=\"fld\"><label>Duration</label><div id=\"fDur\"></div></div>\n  <div style=\"display:flex;justify-content:flex-end;margin-top:14px\"><span class=\"btn\" id=\"btnSend\">Send request</span></div></div></div></div>\n<div class=\"view\" id=\"vDocs\">\n <div class=\"vh\"><h3>EQ-0871 \u00b7 Supplier documents</h3><span class=\"chip\" id=\"dSt\">Supplier A uploading</span></div>\n <div class=\"docs\">\n  <div class=\"file\" id=\"u1\"><span class=\"th\"></span><div class=\"nm\">Registration.pdf<div class=\"pb\"><i></i></div></div></div>\n  <div class=\"file\" id=\"u2\"><span class=\"th\"></span><div class=\"nm\">Insurance.pdf<div class=\"pb\"><i></i></div></div></div>\n  <div class=\"file\" id=\"u3\"><span class=\"th\"></span><div class=\"nm\">Load test certificate.pdf<div class=\"pb\"><i></i></div></div></div>\n  <div class=\"file\" id=\"u4\"><span class=\"th\"></span><div class=\"nm\">Photos, 6 angles<div class=\"pb\"><i></i></div></div></div>\n </div>\n <div class=\"card\" style=\"margin-top:14px\"><h6>WHY THIS MATTERS</h6><p style=\"font-size:12.5px;color:var(--t2);line-height:1.6\">Every paper and photo lives on the machine's own record. No more digging through inboxes when someone asks.</p></div></div>\n<div class=\"view\" id=\"vInsp\">\n <div class=\"vh\"><h3>EQ-0871 \u00b7 Fleet inspection</h3><span class=\"chip\" id=\"iSt\">In inspection</span></div>\n <ul class=\"ck\"><li id=\"k1\"><i></i>Registration valid</li><li id=\"k2\"><i></i>Insurance in date</li><li id=\"k3\"><i></i>Load test certificate<span class=\"chip hide\" id=\"k3c\">expired, returned to supplier</span></li><li id=\"k4\"><i></i>Visual condition from photos</li></ul>\n <div class=\"file\" id=\"re\" style=\"margin-top:12px\"><span class=\"th\"></span><div class=\"nm\">Load test certificate, renewed.pdf<div class=\"pb\"><i style=\"width:100%\"></i></div></div><span class=\"chip good\">resubmitted</span></div></div>\n<div class=\"view\" id=\"vAppr\">\n <div class=\"vh\"><h3>EQ-0871 \u00b7 Approvals</h3><span class=\"chip\" id=\"aSt\">In approval</span></div>\n <div class=\"card\"><h6>SIGN OFF, IN ORDER</h6>\n <div class=\"chain\"><div class=\"cn\" id=\"a1\"><b>FL</b><span>Fleet</span></div><div class=\"cl\"><i id=\"l1\"></i></div><div class=\"cn\" id=\"a2\"><b>PJ</b><span>Project</span></div><div class=\"cl\"><i id=\"l2\"></i></div><div class=\"cn\" id=\"a3\"><b>PC</b><span>Procurement</span></div></div>\n <div class=\"esc\" id=\"po\" style=\"border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.08);color:var(--good)\">Approved. The order flows straight into purchasing, no retyping.</div></div></div>\n<div class=\"view\" id=\"vBoard\">\n <div class=\"vh\"><h3>Fleet, live</h3><div style=\"display:flex;gap:8px\"><span class=\"chip good\" id=\"nW\">Working 41</span><span class=\"chip bad\" id=\"nD\">Down 2</span><span class=\"chip\">Demobilized 9</span></div></div>\n <div class=\"board\">\n  <div class=\"ast hide\" id=\"cr\"><h5>CR-50 \u00b7 Mobile crane</h5><p>Tower B \u00b7 Supplier A</p><span class=\"chip good\" id=\"crS\">Working</span> <span class=\"btn ghost\" id=\"btnBk\" style=\"float:right;padding:4px 9px;font-size:10.5px\">Report breakdown</span></div>\n  <div class=\"ast\"><h5>EX-20 \u00b7 Excavator</h5><p>Marina \u00b7 Supplier C</p><span class=\"chip good\">Working</span></div>\n  <div class=\"ast\"><h5>BL-12 \u00b7 Boom lift</h5><p>Tower A \u00b7 Supplier B</p><span class=\"chip good\">Working</span></div>\n  <div class=\"ast\"><h5>WT-08 \u00b7 Water tanker</h5><p>Camp North \u00b7 Supplier A</p><span class=\"chip\">Demobilized</span></div>\n  <div class=\"ast\"><h5>FL-03 \u00b7 Forklift</h5><p>Warehouse 3 \u00b7 Supplier B</p><span class=\"chip bad\">Down</span></div>\n  <div class=\"ast\"><h5>GN-15 \u00b7 Generator</h5><p>Tower B \u00b7 Supplier C</p><span class=\"chip good\">Working</span></div>\n  <div class=\"ast\"><h5>DT-31 \u00b7 Dump truck</h5><p>Marina \u00b7 Supplier A</p><span class=\"chip good\">Working</span></div>\n  <div class=\"ast\"><h5>RL-02 \u00b7 Roller</h5><p>Depot \u00b7 Supplier B</p><span class=\"chip bad\">Down</span></div>\n  <div class=\"ast\"><h5>TC-01 \u00b7 Tower crane</h5><p>Tower A \u00b7 Supplier C</p><span class=\"chip good\">Working</span></div>\n </div></div>\n", "extra": "<div class=\"phone\" id=\"phone\"><div class=\"scr\"><div class=\"tm\">7:05</div><div class=\"dt\">Wednesday 1 October</div>\n<div class=\"notif\" id=\"notif\"><div class=\"nh\"><i></i>FLEET \u00b7 now</div><b>Crane arrived at Tower B</b><p>CR-50, 50 ton mobile crane from Supplier A. Confirm it has been received?</p><span class=\"nbtn\" id=\"nOk\">Confirm receipt</span></div></div></div>\n<div class=\"toasts\"><div class=\"toast r\" id=\"t1\"><b>Supplier A notified</b>CR-50 down at Tower B. Repair requested.</div>\n<div class=\"toast r\" id=\"t2\"><b>Fleet team notified</b>Breakdown logged with time and photos.</div>\n<div class=\"toast r\" id=\"t3\"><b>Procurement notified</b>Downtime tracked against the hire contract.</div></div>"});
</script></body></html>
